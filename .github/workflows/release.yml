name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_DIR: dist/release
    steps:
      - name: Validate version tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a version tag such as v1.0.0" >&2
            exit 1
          fi
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build source and model archives
        run: |
          python3 launch/package_release.py --tag "$RELEASE_TAG" --output "$RELEASE_DIR"
      - name: Upload assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$RELEASE_DIR/l_arm-$RELEASE_TAG.zip" \
            "$RELEASE_DIR/l_arm-$RELEASE_TAG.tar.gz" \
            "$RELEASE_DIR/l_arm-$RELEASE_TAG-manifest.json" \
            "$RELEASE_DIR/SHA256SUMS" \
            --verify-tag --draft --title "l_arm $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          gh release edit "$RELEASE_TAG" --draft=false
